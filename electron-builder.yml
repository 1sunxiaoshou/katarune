appId: app.katarune.desktop
productName: Katarune
icon: katarune-logo.png
asar:
  smartUnpack: false
npmRebuild: true
compression: normal
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
asarUnpack:
  - node_modules/sherpa-onnx-*/**/*
  - node_modules/better-sqlite3/build/Release/better_sqlite3.node
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!**/*.map"
  # These packages expose compiled JS at runtime; retain their licenses.
  - "!node_modules/{ai,zod,assistant-stream}/{src,docs}/**/*"
  - "!node_modules/@ai-sdk/*/{src,docs}/**/*"
  - "!node_modules/**/*.d.{ts,cts,mts}"
  - "!node_modules/**/{test,tests,__tests__}/**/*"
  - "!node_modules/**/*.{test,spec}.{js,cjs,mjs,ts,tsx,jsx}"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/deps/**/*"
  - "!node_modules/better-sqlite3/src/**/*"
  - "!node_modules/better-sqlite3/build/deps/**/*"
  - "!node_modules/better-sqlite3/build/Release/obj/**/*"
  - "!node_modules/better-sqlite3/build/Release/better_sqlite3.{exp,iobj,ipdb,lib,pdb}"
  - "!node_modules/better-sqlite3/build/Release/sqlite3.lib"
  - "!node_modules/better-sqlite3/build/Release/test_extension.*"
  - "!node_modules/better-sqlite3/build/*.{gypi,sln,vcxproj,filters}"
  - drizzle/**/*
  - package.json
extraResources:
  - from: resources/vad-segmenter.cjs
    to: vad-segmenter.cjs
  - from: resources/asr/silero-vad
    to: asr/silero-vad
  - from: resources/asr-worker.cjs
    to: asr-worker.cjs
  - from: resources/asr/sensevoice-int8
    to: asr/sensevoice-int8
  - from: resources/characters
    to: characters
    filter:
      - "**/*"
      - "!katarune-portrait.png"
  - from: resources/fonts
    to: fonts
  - from: node_modules/@fontsource/yellowtail/LICENSE
    to: fonts/Yellowtail-LICENSE.txt
win:
  icon: katarune-logo.ico
  extraResources:
    - from: build/release/avatar
      to: avatar
      filter:
        - "**/*"
        - "!**/*_DoNotShip/**/*"
        - "!**/*.pdb"
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
nsis:
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  differentialPackage: false
  unicode: true
  installerLanguages:
    - zh_CN
  displayLanguageSelector: false
  uninstallDisplayName: "${productName}"
  include: installer/installer.nsh
